<!DOCTYPE html>
<html>
<head>

<body>
  <h1>Admin Upload</h1>

  <div class="card" style="width:400px; margin:auto;">

    <textarea id="description" placeholder="Description" style="width:100%; margin-bottom:10px; padding:8px;"></textarea><br>

    <p id="status"></p>
  </div>

  <script src="admin.js"></script>
</body>
</html>
